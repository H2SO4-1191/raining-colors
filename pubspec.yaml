name: raining_colors
description: A simple game where you pop raining color balloons with satisfying effects.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: assets/images/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
